[workspace]
members = ["compliance_suite","cpu","e2ee", "gpu",
    "hybrid_crypto", "wasm_api", "compliance_suite"
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
