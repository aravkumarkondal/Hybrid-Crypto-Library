[workspace]
members = [
    "compliance_suite",
    "cpu",
    "e2ee",
    "gpu",
    "hybrid_crypto",
    "wasm_api",
    "apple_software_keystore",
    "windows_software_keystore",
    "linux_software_keystore",
    "web_keystore",
]
resolver = "2"

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = "symbols"

[profile.dev]
opt-level = 0
debug = true
