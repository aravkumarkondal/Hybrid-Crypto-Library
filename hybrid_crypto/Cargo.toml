[package]
name = "hybrid_crypto"
version = "0.1.0"
edition = "2021"
description = "A zero-dependency, cross-platform hybrid cryptosystem in Rust from scratch"

[lib]
crate-type = ["rlib"]

[dependencies]
cpu = { path = "../cpu" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
aes = "0.8"
[features]
default = ["hybrid", "ml-dsa"]
hybrid = ["x25519", "ml-kem", "aes-gcm", "sha3", "hkdf"]
x25519 = []
ml-kem = ["sha3"]
ml-dsa = ["sha3"]
aes-gcm = []
sha3 = []
hkdf = ["sha3"]
[profile.dev]
panic = "abort"

[profile.test]
panic = "abort"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[[example]]
name = "encrypt_paragraph"
required-features = ["hybrid"]

[dev-dependencies]
criterion = "0.5"
proptest = "1.11.0"

[[bench]]
name = "bench"
path = "benches/crypto/bench.rs"
harness = false

[lints]
workspace = true
